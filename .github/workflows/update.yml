name: Update BVC Dashboard

on:
  # Main trigger: the Cloudflare Worker bvc-scheduler calls workflow_dispatch
  # every 5 minutes in market hours (cloudflare/bvc-scheduler.js).
  # GitHub's own schedule stays only as a best-effort backup.
  schedule:
    - cron: '*/5 13-17 * * 1-5'
  # Cloudflare scheduler + manual trigger from the Actions tab
  workflow_dispatch:

# Allow the workflow to commit back to the repo
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bvc-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # Latest main, not the commit that was current when the run was
          # queued: runs wait for each other (concurrency), so the previous
          # run's commit must be the starting point or the push is rejected.
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Caracas timezone
        run: |
          sudo timedatectl set-timezone America/Caracas || true
          echo "Current time: $(date)"

      - name: Sync BVC stocks + indexes + official FX
        run: python bvc.py --once
        continue-on-error: true

      - name: Sync parallel FX rate (p2p.army)
        run: python load_parallel_rates.py
        continue-on-error: true

      - name: Load official BVC market reports (daily closes + weekly bulletins)
        run: python load_market_reports.py
        continue-on-error: true

      - name: Otros bienes (CFB) day by day, for the week in progress
        run: python load_otros_bienes.py
        continue-on-error: true

      - name: Data quality and DB size maintenance
        run: python maintenance.py
        continue-on-error: true

      - name: Rebuild dashboard HTML
        run: |
          python build_dashboard.py
          # Pages serves index.html at the root
          cp bvc_dashboard.html index.html

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bvc.db index.html bvc_dashboard.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: auto-update $(date -u +'%Y-%m-%d %H:%MZ')"
            # If main moved meanwhile (e.g. a manual push), replay this run's
            # commit on top, keeping this run's freshly built files.
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push rejected, rebasing on latest main (attempt $attempt)"
              git fetch --depth=20 origin main
              git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            done
            exit 1
          fi

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (post-update)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
